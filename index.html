<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treasure Hunter - Card Clicker Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .card { transition: transform 0.1s; cursor: pointer; }
        .card:active { transform: scale(0.95); }
        .card-hidden { background-color: #3b82f6; }
        .card-treasure { background-color: #fbbf24; animation: popIn 0.3s ease-out; }
        .card-bomb { background-color: #ef4444; animation: shake 0.3s; }
        
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        /* Custom scrollbar for leaderboard */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden">

    <header class="bg-indigo-600 text-white shadow-md p-4 flex justify-between items-center z-10">
        <h1 class="text-xl md:text-2xl font-bold flex items-center gap-2">
            <i class="fa-solid fa-crown text-yellow-300"></i> トレジャーハンター
        </h1>
        <div id="auth-container" class="flex gap-2 items-center">
            <button id="login-btn" class="bg-white text-indigo-600 px-4 py-1.5 rounded-full font-bold shadow hover:bg-gray-100 transition hidden">
                <i class="fa-brands fa-google mr-1"></i> ログイン
            </button>
            <div id="user-info" class="hidden flex items-center gap-3">
                <div id="user-status" class="text-sm font-medium bg-indigo-700 px-3 py-1 rounded-full flex items-center gap-2">
                    <!-- User info will go here -->
                </div>
                <button id="logout-btn" class="text-sm text-indigo-200 underline hover:text-white transition">ログアウト</button>
            </div>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 md:p-8 flex flex-col lg:flex-row gap-8 max-w-6xl mx-auto w-full">
        
        <section class="flex-1 flex flex-col items-center justify-center bg-white rounded-2xl shadow-lg p-6 relative">
            <div class="w-full flex justify-between items-center mb-6">
                <div class="text-2xl font-bold text-gray-700">
                    スコア: <span id="score-display" class="text-indigo-600 text-3xl">0</span>
                </div>
                <div class="text-xl font-bold text-gray-700 flex items-center gap-2">
                    <i class="fa-solid fa-stopwatch text-red-500"></i>
                    残り時間: <span id="time-display" class="w-8 text-center inline-block">15</span>秒
                </div>
            </div>

            <!-- 3x3 Grid -->
            <div id="game-grid" class="grid grid-cols-3 gap-3 md:gap-4 w-full max-w-[350px] aspect-square mb-6 pointer-events-none opacity-50 transition-opacity duration-300">
                <!-- Cards generated by JS -->
            </div>

            <button id="start-btn" class="w-full max-w-[350px] bg-gradient-to-r from-green-400 to-green-600 text-white font-bold text-xl py-4 rounded-xl shadow-md hover:shadow-lg hover:from-green-500 hover:to-green-700 transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                ゲームスタート！
            </button>
        </section>

        <section class="flex-1 bg-white rounded-2xl shadow-lg p-6 flex flex-col h-[500px] lg:h-auto">
            <h2 class="text-2xl font-bold mb-4 flex items-center gap-2 text-indigo-600 border-b pb-2">
                <i class="fa-solid fa-trophy text-yellow-400"></i> ランキング
            </h2>
            <div class="flex-1 overflow-y-auto scrollbar-hide space-y-3" id="leaderboard-list">
                <!-- Leaderboard items inserted here -->
                <div class="text-center text-gray-400 py-10">
                    <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                    <p>データを読み込み中...</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Game Over / Save Score Modal -->
    <div id="save-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl p-8 max-w-sm w-full shadow-2xl transform scale-95 transition-transform duration-300" id="save-modal-content">
            <h3 class="text-2xl font-bold text-center mb-2">タイムアップ！</h3>
            <p class="text-center text-gray-600 mb-6">あなたのスコア: <span id="final-score" class="font-bold text-3xl text-indigo-600">0</span></p>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">プレイヤー名</label>
                <input type="text" id="player-name-input" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="名前を入力..." maxlength="15">
            </div>
            
            <div class="flex gap-3 mt-6">
                <button id="cancel-save-btn" class="flex-1 bg-gray-200 text-gray-800 py-2 rounded-lg font-semibold hover:bg-gray-300 transition">キャンセル</button>
                <button id="save-score-btn" class="flex-1 bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700 transition">保存する</button>
            </div>
        </div>
    </div>

    <!-- Edit/Delete Modal -->
    <div id="edit-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl p-8 max-w-sm w-full shadow-2xl transform scale-95 transition-transform duration-300" id="edit-modal-content">
            <h3 class="text-xl font-bold mb-4">データの編集・削除</h3>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">新しい名前</label>
                <input type="text" id="edit-name-input" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" maxlength="15">
            </div>
            
            <div class="flex flex-col gap-3 mt-6">
                <button id="update-record-btn" class="w-full bg-blue-500 text-white py-2 rounded-lg font-semibold hover:bg-blue-600 transition">名前を更新</button>
                <button id="delete-record-btn" class="w-full bg-red-500 text-white py-2 rounded-lg font-semibold hover:bg-red-600 transition">この記録を削除</button>
                <button id="close-edit-modal" class="w-full bg-gray-200 text-gray-800 py-2 rounded-lg font-semibold hover:bg-gray-300 transition mt-2">閉じる</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAWxgXh1DwM24FKLz6Xo13tv7hZl57j5Jg",
            authDomain: "task89.firebaseapp.com",
            projectId: "task89",
            storageBucket: "task89.firebasestorage.app",
            messagingSenderId: "313433212809",
            appId: "1:313433212809:web:7c6f490e48615388924358"
        };

        let app, db, auth, provider;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            provider = new GoogleAuthProvider();
        } catch (e) {
            console.error("Firebase initialization error:", e);
        }

        const appId = 'github-pages-card-game'; // Identifier for Firestore paths

        // Global Variables
        let currentUser = null;
        let isPlaying = false;
        let score = 0;
        let timeLeft = 15;
        let gameInterval = null;
        let spawnInterval = null;
        const GRID_SIZE = 9;
        let currentEditDocId = null;

        // DOM Elements
        const scoreDisplay = document.getElementById('score-display');
        const timeDisplay = document.getElementById('time-display');
        const gameGrid = document.getElementById('game-grid');
        const startBtn = document.getElementById('start-btn');
        const userStatus = document.getElementById('user-status');
        const leaderboardList = document.getElementById('leaderboard-list');
        
        // Modals
        const saveModal = document.getElementById('save-modal');
        const saveModalContent = document.getElementById('save-modal-content');
        const editModal = document.getElementById('edit-modal');
        const editModalContent = document.getElementById('edit-modal-content');

        // Auth Elements
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');

        // Google Login
        loginBtn.addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Login error:", error);
            }
        });

        // Logout
        logoutBtn.addEventListener('click', async () => {
            try {
                await signOut(auth);
            } catch (error) {
                console.error("Logout error:", error);
            }
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loginBtn.classList.add('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('user-status').innerHTML = `<i class="fa-solid fa-user"></i> <span class="truncate max-w-[100px]">${user.displayName || 'ユーザー'}</span>`;
                startBtn.disabled = false;
                startBtn.textContent = 'ゲームスタート！';
                setupFirestoreListeners();
            } else {
                currentUser = null;
                loginBtn.classList.remove('hidden');
                document.getElementById('user-info').classList.add('hidden');
                startBtn.disabled = true;
                startBtn.textContent = 'ログインしてプレイ';
                document.getElementById('leaderboard-list').innerHTML = '<div class="text-center text-gray-400 py-10">ランキングを見るにはログインしてください</div>';
            }
        });

        function initGrid() {
            gameGrid.innerHTML = '';
            for (let i = 0; i < GRID_SIZE; i++) {
                const card = document.createElement('div');
                card.className = 'card card-hidden rounded-xl shadow flex items-center justify-center text-4xl text-white';
                card.dataset.index = i;
                card.dataset.type = 'empty';
                
                // Add icon element inside
                const icon = document.createElement('i');
                icon.className = 'fa-solid fa-question opacity-20';
                card.appendChild(icon);

                // Click event
                card.addEventListener('pointerdown', handleCardClick);
                gameGrid.appendChild(card);
            }
        }

        function spawnTargets() {
            if (!isPlaying) return;
            const cards = gameGrid.children;
            
            // Reset all cards
            for (let i = 0; i < cards.length; i++) {
                cards[i].className = 'card card-hidden rounded-xl shadow flex items-center justify-center text-4xl text-white';
                cards[i].dataset.type = 'empty';
                cards[i].innerHTML = '<i class="fa-solid fa-question opacity-20"></i>';
            }

            // Pick 1-3 random cards to be targets
            const numTargets = Math.floor(Math.random() * 3) + 1;
            const chosenIndices = [];
            while(chosenIndices.length < numTargets) {
                let r = Math.floor(Math.random() * GRID_SIZE);
                if(chosenIndices.indexOf(r) === -1) chosenIndices.push(r);
            }

            chosenIndices.forEach(idx => {
                const card = cards[idx];
                // 20% chance for a bomb (penalty), 80% for treasure (points)
                if (Math.random() < 0.2) {
                    card.dataset.type = 'bomb';
                    card.className = 'card card-bomb rounded-xl shadow flex items-center justify-center text-4xl text-white';
                    card.innerHTML = '<i class="fa-solid fa-bomb"></i>';
                } else {
                    card.dataset.type = 'treasure';
                    card.className = 'card card-treasure rounded-xl shadow flex items-center justify-center text-4xl text-white';
                    card.innerHTML = '<i class="fa-solid fa-gem"></i>';
                }
            });
        }

        function handleCardClick(e) {
            if (!isPlaying) return;
            // Get the card element (could be clicking the icon inside)
            const card = e.target.closest('.card');
            if (!card) return;

            const type = card.dataset.type;
            
            if (type === 'treasure') {
                score += 10;
                showFloatingText(e.clientX, e.clientY, "+10", "text-green-500");
                card.dataset.type = 'empty'; // Prevent double click
                card.innerHTML = '<i class="fa-solid fa-check text-green-300"></i>';
                card.className = 'card bg-green-100 rounded-xl shadow flex items-center justify-center text-4xl';
            } else if (type === 'bomb') {
                score = Math.max(0, score - 5);
                showFloatingText(e.clientX, e.clientY, "-5", "text-red-500");
                card.dataset.type = 'empty';
                card.innerHTML = '<i class="fa-solid fa-xmark text-red-300"></i>';
                card.className = 'card bg-red-100 rounded-xl shadow flex items-center justify-center text-4xl';
            }
            scoreDisplay.textContent = score;
        }

        // Floating text animation for score feedback
        function showFloatingText(x, y, text, colorClass) {
            const el = document.createElement('div');
            el.textContent = text;
            el.className = `fixed font-bold text-2xl z-50 pointer-events-none transition-all duration-500 transform ${colorClass}`;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            document.body.appendChild(el);

            // Animate up and fade out
            requestAnimationFrame(() => {
                el.style.transform = `translateY(-50px)`;
                el.style.opacity = '0';
            });

            setTimeout(() => { document.body.removeChild(el); }, 500);
        }

        function startGame() {
            if (!currentUser) return;
            isPlaying = true;
            score = 0;
            timeLeft = 15;
            
            scoreDisplay.textContent = score;
            timeDisplay.textContent = timeLeft;
            startBtn.disabled = true;
            startBtn.textContent = 'プレイ中...';
            
            gameGrid.classList.remove('pointer-events-none', 'opacity-50');
            
            initGrid();
            spawnTargets();

            // Timer Loop
            gameInterval = setInterval(() => {
                timeLeft--;
                timeDisplay.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            // Target Spawning Loop
            spawnInterval = setInterval(() => {
                spawnTargets();
            }, 800);
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            clearInterval(spawnInterval);
            gameGrid.classList.add('pointer-events-none', 'opacity-50');
            
            startBtn.textContent = 'もう一度プレイ';
            startBtn.disabled = false;

            // Show Save Modal
            document.getElementById('final-score').textContent = score;
            const savedName = localStorage.getItem('lastPlayerName') || (currentUser ? currentUser.displayName : '');
            document.getElementById('player-name-input').value = savedName;
            
            openModal(saveModal, saveModalContent);
        }

        startBtn.addEventListener('click', startGame);

        function openModal(modalWrap, modalContent) {
            modalWrap.classList.remove('hidden');
            // Slight delay to allow display:block to apply before animating opacity
            setTimeout(() => {
                modalWrap.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
            }, 10);
        }

        function closeModal(modalWrap, modalContent) {
            modalWrap.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modalWrap.classList.add('hidden');
            }, 300);
        }

        document.getElementById('cancel-save-btn').addEventListener('click', () => {
            closeModal(saveModal, saveModalContent);
        });

        document.getElementById('save-score-btn').addEventListener('click', async () => {
            const nameInput = document.getElementById('player-name-input').value.trim();
            const playerName = nameInput || '名無しハンター';
            
            localStorage.setItem('lastPlayerName', playerName);
            closeModal(saveModal, saveModalContent);
            
            if (!currentUser || score === 0) return; // Don't save 0 scores

            try {
                // Rule 1: Public path
                const scoresRef = collection(db, 'artifacts', appId, 'public', 'data', 'scores');
                await addDoc(scoresRef, {
                    userId: currentUser.uid,
                    playerName: playerName,
                    score: score,
                    timestamp: serverTimestamp()
                });
            } catch (e) {
                console.error("Error saving score: ", e);
            }
        });

        function setupFirestoreListeners() {
            if (!currentUser) return;

            const scoresRef = collection(db, 'artifacts', appId, 'public', 'data', 'scores');
            
            // Rule 2: No complex queries (orderBy/limit). Fetch all, process in JS memory.
            onSnapshot(scoresRef, (snapshot) => {
                let scoresData = [];
                snapshot.forEach(doc => {
                    scoresData.push({ id: doc.id, ...doc.data() });
                });

                // Sort descending by score
                scoresData.sort((a, b) => b.score - a.score);
                
                // Limit to top 50 in memory to prevent huge UI rendering
                scoresData = scoresData.slice(0, 50);

                renderLeaderboard(scoresData);

            }, (error) => {
                console.error("Listen failed: ", error);
                leaderboardList.innerHTML = `<div class="text-red-500 text-center p-4">データの読み込みに失敗しました。</div>`;
            });
        }

        function renderLeaderboard(data) {
            leaderboardList.innerHTML = '';
            if (data.length === 0) {
                leaderboardList.innerHTML = '<div class="text-center text-gray-400 py-10">まだ記録がありません。最初の記録を作りましょう！</div>';
                return;
            }

            data.forEach((item, index) => {
                let rankIcon = '';
                let bgClass = 'bg-gray-50';
                
                if (index === 0) {
                    rankIcon = '<i class="fa-solid fa-medal text-yellow-500 text-xl"></i>';
                    bgClass = 'bg-yellow-50 border border-yellow-200 shadow-sm';
                } else if (index === 1) {
                    rankIcon = '<i class="fa-solid fa-medal text-gray-400 text-xl"></i>';
                    bgClass = 'bg-gray-100';
                } else if (index === 2) {
                    rankIcon = '<i class="fa-solid fa-medal text-amber-700 text-xl"></i>';
                } else {
                    rankIcon = `<span class="font-bold text-gray-400 w-6 text-center">${index + 1}</span>`;
                }

                const isMe = currentUser && item.userId === currentUser.uid;
                const dateObj = item.timestamp ? item.timestamp.toDate() : new Date();
                const dateStr = `${dateObj.getMonth()+1}/${dateObj.getDate()} ${dateObj.getHours()}:${String(dateObj.getMinutes()).padStart(2, '0')}`;

                const row = document.createElement('div');
                row.className = `flex items-center justify-between p-3 rounded-xl ${bgClass} ${isMe ? 'ring-2 ring-indigo-400' : ''}`;
                
                // Left side: Rank + Name
                const leftDiv = document.createElement('div');
                leftDiv.className = 'flex items-center gap-3';
                leftDiv.innerHTML = `
                    <div class="w-8 flex justify-center">${rankIcon}</div>
                    <div class="flex flex-col">
                        <span class="font-bold text-gray-800 ${isMe ? 'text-indigo-700' : ''}">${escapeHtml(item.playerName)} ${isMe ? '<span class="text-xs bg-indigo-100 text-indigo-700 px-1 py-0.5 rounded ml-1">あなた</span>' : ''}</span>
                        <span class="text-xs text-gray-400">${dateStr}</span>
                    </div>
                `;

                // Right side: Score + Edit/Delete actions (if it's the current user)
                const rightDiv = document.createElement('div');
                rightDiv.className = 'flex items-center gap-4';
                
                const scoreSpan = document.createElement('span');
                scoreSpan.className = 'font-black text-xl text-indigo-600';
                scoreSpan.textContent = `${item.score} pt`;
                rightDiv.appendChild(scoreSpan);

                if (isMe) {
                    const actionBtn = document.createElement('button');
                    actionBtn.className = 'w-8 h-8 rounded-full bg-gray-200 text-gray-600 hover:bg-indigo-100 hover:text-indigo-600 flex items-center justify-center transition';
                    actionBtn.innerHTML = '<i class="fa-solid fa-ellipsis-vertical"></i>';
                    actionBtn.onclick = () => openEditModal(item.id, item.playerName);
                    rightDiv.appendChild(actionBtn);
                }

                row.appendChild(leftDiv);
                row.appendChild(rightDiv);
                leaderboardList.appendChild(row);
            });
        }

        // XSS Prevention Utility
        function escapeHtml(unsafe) {
            return (unsafe || '').toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        function openEditModal(docId, currentName) {
            currentEditDocId = docId;
            document.getElementById('edit-name-input').value = currentName;
            openModal(editModal, editModalContent);
        }

        document.getElementById('close-edit-modal').addEventListener('click', () => {
            closeModal(editModal, editModalContent);
            currentEditDocId = null;
        });

        document.getElementById('update-record-btn').addEventListener('click', async () => {
            if (!currentUser || !currentEditDocId) return;
            const newName = document.getElementById('edit-name-input').value.trim();
            if (!newName) return;

            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'scores', currentEditDocId);
                await updateDoc(docRef, {
                    playerName: newName
                });
                closeModal(editModal, editModalContent);
            } catch (e) {
                console.error("Error updating doc: ", e);
            }
        });

        document.getElementById('delete-record-btn').addEventListener('click', async () => {
            if (!currentUser || !currentEditDocId) return;
            
            // Custom confirm logic using the modal itself (avoiding window.confirm)
            const confirmBtn = document.getElementById('delete-record-btn');
            if (confirmBtn.textContent !== '本当に削除しますか？') {
                confirmBtn.textContent = '本当に削除しますか？';
                confirmBtn.classList.replace('bg-red-500', 'bg-red-700');
                return; // Wait for second click
            }

            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'scores', currentEditDocId);
                await deleteDoc(docRef);
                closeModal(editModal, editModalContent);
                // Reset button text
                setTimeout(() => {
                    confirmBtn.textContent = 'この記録を削除';
                    confirmBtn.classList.replace('bg-red-700', 'bg-red-500');
                }, 300);
            } catch (e) {
                console.error("Error deleting doc: ", e);
            }
        });

        // Initialize empty grid visual
        initGrid();

    </script>
</body>
</html>
